<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b0d12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Knowgram">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Knowgram</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="bar">
      <h1>Know<span>gram</span></h1>
      <div class="modes">
        <button data-mode="feed" class="on">Feed</button>
        <button data-mode="saved">Gespeichert</button>
        <button data-mode="profile">Profil</button>
        <button id="moon" class="moon" aria-label="Abendmodus und Schlaf-Timer">🌙</button>
      </div>
    </div>
    <nav id="chips" aria-label="Themen"></nav>
  </header>
  <main id="feed"></main>
  <div id="sheet" hidden></div>
  <div id="kbhint">↑ ↓ Karte · ← → Seite · Punkte anklicken</div>
  <div id="toast" hidden></div>
</div>
<script src="cards.js"></script>
<script src="art.js"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
