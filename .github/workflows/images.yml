name: Titelbilder suchen

on:
  schedule:
    - cron: "37 4 * * *"      # täglich, nach dem Karten-Lauf der Routine (pro Lauf max. 40 Karten, der Rest folgt)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bilder zu neuen Karten suchen (Wikimedia Commons)
        continue-on-error: true   # Bilder sind nur Zusatz: Probleme bei Wikimedia sollen keinen Fehler-Alarm auslösen
        run: python tools/fetch_images.py
      - name: Änderungen committen
        run: |
          git config user.name "knowgram-bot"
          git config user.email "knowgram-bot@users.noreply.github.com"
          git add images.json
          if git diff --staged --quiet; then echo "Keine Änderungen"; else git commit -m "Titelbilder aktualisiert" && git pull --rebase origin main && git push; fi
